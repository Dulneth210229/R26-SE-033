<section class="bg-gray-50 p-6">
  <h2 class="text-2xl font-bold text-indigo-600 mb-4">Add New Item</h2>
  <form class="space-y-6">
    <div class="flex items-center space-x-4">
      <div class="w-24 h-24 bg-gray-200 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg class="w-10 h-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
      </div>
      <input type="file" name="image" id="image" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-white dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400">
    </div>
    <div>
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Name</label>
      <input type="text" id="name" name="name" value="Wireless Headphones" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
    </div>
    <div>
      <label for="description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
      <textarea id="description" name="description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-white rounded-lg border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" placeholder="Enter item description...">Noise-cancelling wireless headphones with high-quality sound and comfortable earbuds.</textarea>
    </div>
    <div class="flex space-x-4">
      <div class="w-full">
        <label for="price" class="block mb-2 text-sm font-medium text-gray-900">Price</label>
        <input type="number" id="price" name="price" value="59.99" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
      </div>
      <div class="w-full">
        <label for="quantity" class="block mb-2 text-sm font-medium text-gray-900">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="10" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
      </div>
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg">Add Item</button>
  </form>
</section>
